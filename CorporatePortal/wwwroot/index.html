<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Корпоративный портал</title>
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
  <div class="decor decor-yellow"></div>
  <div class="decor decor-blue"></div>
  <header class="hero shell">
    <a class="brand" href="/">
      <img id="portal-logo" alt="Логотип компании" src="/images/logo-placeholder.svg">
    </a>
    <div class="hero-card">
      <p class="eyebrow">Единое окно корпоративных сервисов</p>
      <h1 id="portal-title">Корпоративная информационная страница</h1>
      <p id="portal-welcome">Загрузка данных портала...</p>
    </div>
    <a class="admin-link" href="/admin.html">Управление</a>
  </header>

  <main class="shell">
    <section aria-labelledby="links-heading" class="panel">
      <div class="section-heading">
        <h2 id="links-heading">Корпоративные ресурсы</h2>
        <p>Группы ссылок управляются в административной панели.</p>
      </div>
      <div id="link-groups" class="link-grid"></div>
    </section>

    <section aria-labelledby="modules-heading" class="panel modules-panel">
      <div class="section-heading">
        <h2 id="modules-heading">Информационные модули</h2>
        <p>Важные сообщения, дни рождения, погода и другие виджеты.</p>
      </div>
      <div id="modules" class="module-grid"></div>
    </section>
  </main>

  <template id="group-template">
    <article class="link-group">
      <h3><span class="group-icon"></span><span class="group-title"></span></h3>
      <p class="group-description"></p>
      <ul></ul>
    </article>
  </template>

  <template id="module-template">
    <article class="module-card">
      <h3></h3>
      <div class="module-content"></div>
    </article>
  </template>

  <script src="/js/portal.js"></script>
</body>
</html>
